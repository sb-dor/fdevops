name: Android Firebase Distribution CD

on:
  push:
    branches:
      - android-fd-cd

jobs:
  android-fd-cd:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 2. Setup Flutter SDK
      - name: Setup Flutter and dependencies
        uses: ./.github/actions/setup
        with:
          flutter-version: "3.44.7"

      # 3. Install dependencies
      - name: Install dependencies
        timeout-minutes: 1
        run: flutter pub get

      # 4. Generate code (l10n, assets, build_runner) — must be before format/analyze
      - name: Generate code (l10n, assets, build_runner)
        timeout-minutes: 10
        run: bash scripts/generate.bash

      # 8. Parse changelog — before build so version info is ready
      - name: Extract latest changelog entry
        id: changelog
        run: |
          VERSION=$(grep -m 1 '## \[' CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/')
          NOTES=$(awk '/^## \[/{found++} found==1{print} found==2{exit}' CHANGELOG.md | tail -n +2)

          # Remove trailing ### headers without content
          NOTES=$(echo "$NOTES" | sed '/^### [A-Za-z]*[[:space:]]*$/d')

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "$NOTES" > release_notes.txt
          echo "release_notes_file=release_notes.txt" >> $GITHUB_OUTPUT

          echo "✅ Extracted version: $VERSION"
          echo "📝 Release notes:"
          echo "$NOTES"

      # 5. Decode all secrets — before build (Firebase app distribution is not necessary for now)
      - name: Setup Firebase CLI
        run: |
          curl -sL https://firebase.tools | bash
          firebase --version

      # Decoded into the workspace, not $HOME: the App Distribution action runs in
      # Docker and only ${{ github.workspace }} is mounted into the container.
      - name: Authenticate with Firebase
        run: |
          printf '%s' "$FIREBASE_CREDENTIALS" | base64 --decode > firebase_key.json
          chmod 600 firebase_key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/firebase_key.json" >> $GITHUB_ENV
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}

      - name: Write Google Play service account
        run: |
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT" | base64 --decode > android/google_play_key.json
          chmod 600 android/google_play_key.json
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}

      # - name: Create firebase_options
      #   run: 'echo "$FIREBASE_OPTIONS" | base64 --decode > lib/firebase_options.dart'
      #   env:
      #     FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}

      # - name: Create google_service_json for Android
      #   run: 'echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json'
      #   env:
      #     GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Create key.properties for Android
        run: 'echo "$KEY_PROPERTIES" | base64 --decode > android/key.properties'
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}

      - name: Create upload-keystore for Android
        run: 'echo "$UPLOAD_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks'
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}

      - name: Create production config
        run: 'echo "$PRODUCTION_CONFIG" | base64 --decode > config/production.json'
        env:
          PRODUCTION_CONFIG: ${{ secrets.PRODUCTION_CONFIG_BASE64 }}

      # 10. Build
      # ---------------- ANDROID APP BUNDLE + APK ---------------- #
      - name: Build APK (for Firebase Android Distribution)
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define-from-file=config/production.json

      - name: Upload debug symbols to Crashlytics
        run: |
          firebase crashlytics:symbols:upload \
            --app=${{ secrets.ANDROID_FIREBASE_APP_ID }} \
            build/debug-info

      # ---------------- FIREBASE DISTRIBUTION ---------------- #
      - name: Deploy APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.ANDROID_FIREBASE_APP_ID }}
          serviceCredentialsFile: firebase_key.json
          groups: group-testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotesFile: release_notes.txt
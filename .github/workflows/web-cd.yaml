name: Web Continuous Delivery

on:
  push:
    branches:
      - web-cd

# Some setup actions run inside .github/actions/setup, so they do not need to be repeated here.
# This workflow runs only on main. Before this deploy workflow, flutter-checks.yml should handle
# generation, tests, warnings, and code formatting checks.

# You only need PRODUCTION_CONFIG_BASE64 and FIREBASE_CREDENTIALS_JSON.
# FIREBASE_CREDENTIALS_JSON must contain base64 encoded service account JSON.

jobs:
  web-cd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase_key.json

    steps:
      # 1. Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter SDK
      - name: Setup Flutter and dependencies
        uses: ./.github/actions/setup
        with:
          flutter-version: "3.44.7"

      # 3. Generate code (l10n, assets, build_runner) — must be before format/analyze
      - name: Generate code (l10n, assets, build_runner)
        timeout-minutes: 10
        run: bash scripts/generate.bash

      # 4. Decode all secrets before build.
      - name: Create production config
        run: 'echo "$PRODUCTION_CONFIG" | base64 --decode > config/production.json'
        env:
          PRODUCTION_CONFIG: ${{ secrets.PRODUCTION_CONFIG_JSON_BASE64 }}

      # - name: Create firebase_options
      #   run: 'echo "$FIREBASE_OPTIONS" | base64 --decode > lib/firebase_options.dart'
      #   env:
      #     FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}

      # - name: Create firebase.json
      #   run: 'echo "$FIREBASE_JSON" | base64 --decode > firebase.json'
      #   env:
      #     FIREBASE_JSON: ${{ secrets.FIREBASE_JSON_BASE64 }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write Firebase service account
        run: |
          printf '%s' "$FIREBASE_CREDENTIALS" | base64 --decode > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}

      - name: Build Web App
        run: flutter build web --release --dart-define-from-file=config/production.json

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project firebase_project_name
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase_key.json
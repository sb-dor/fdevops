name: Android Continuous Delivery

on:
  push:
    branches:
      - master

jobs:
  android-cd:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 2. Setup Flutter SDK
      - name: Setup Flutter and dependencies
        uses: ./.github/actions/setup
        with:
          flutter-version: "3.44.7"

      # 3. Install dependencies
      - name: Install dependencies
        timeout-minutes: 1
        run: flutter pub get

      # 4. Generate code (l10n, assets, build_runner) — must be before format/analyze
      - name: Generate code (l10n, assets, build_runner)
        timeout-minutes: 10
        run: bash scripts/generate.bash

      # 8. Parse changelog — before build so version info is ready
      - name: Extract latest changelog entry
        id: changelog
        run: |
          VERSION=$(grep -m 1 '## \[' CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/')
          NOTES=$(awk '/^## \[/{found++} found==1{print} found==2{exit}' CHANGELOG.md | tail -n +2)

          # Take complete lines that fit within 500 characters
          TRUNCATED=""
          while IFS= read -r line; do
            TEST="$TRUNCATED$line
          "
            if [ ${#TEST} -gt 500 ]; then
              break
            fi
            TRUNCATED="$TEST"
          done <<< "$NOTES"

          # Remove trailing ### headers without content
          NOTES=$(echo "$TRUNCATED" | sed '/^### [A-Za-z]*[[:space:]]*$/d')

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "$NOTES" > release_notes.txt
          echo "release_notes_file=release_notes.txt" >> $GITHUB_OUTPUT

          echo "✅ Extracted version: $VERSION"
          echo "📝 Release notes:"
          echo "$NOTES"

      # 9. Decode all secrets — before build (Firebase app distribution is not necessary for now)
      - name: Setup Firebase CLI
        run: |
          curl -sL https://firebase.tools | bash
          firebase --version

      - name: Write Firebase service account
        run: |
          printf '%s' "$FIREBASE_CREDENTIALS" | base64 --decode > "$HOME/firebase_key.json"
          chmod 600 "$HOME/firebase_key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase_key.json" >> $GITHUB_ENV
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}

      - name: Write Google Play service account
        run: |
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT" | base64 --decode > android/google_play_key.json
          chmod 600 android/google_play_key.json
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}

      - name: Create key.properties for Android
        run: 'echo "$KEY_PROPERTIES" | base64 --decode > android/key.properties'
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}

      - name: Create upload-keystore for Android
        run: 'echo "$UPLOAD_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks'
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}

      - name: Create production config
        run: 'echo "$PRODUCTION_CONFIG" | base64 --decode > config/production.json'
        env:
          PRODUCTION_CONFIG: ${{ secrets.PRODUCTION_CONFIG_BASE64 }}

      # 10. Build
      # ---------------- ANDROID APP BUNDLE + APK ---------------- #
      - name: Build App Bundle (for Google Play)
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define-from-file=config/production.json

      - name: Upload debug symbols to Crashlytics
        run: |
          firebase crashlytics:symbols:upload \
            --app=${{ secrets.ANDROID_FIREBASE_APP_ID }} \
            build/debug-info

      # ---------------- GOOGLE PLAY RELEASE ---------------- #
      - name: Prepare Google Play release notes
        run: |
          mkdir -p distribution/whatsnew
          cp release_notes.txt distribution/whatsnew/whatsnew-en-US

      - name: Deploy App Bundle to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: android/google_play_key.json
          packageName: package_name
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: draft
          whatsNewDirectory: distribution/whatsnew
          # changesNotSentForReview: true